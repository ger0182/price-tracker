name: Price Check + LINE Broadcast

on:
  schedule:
    # Taiwan time: every day at 10:00 and 16:00
    - cron: '0 10,16 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-check-line-broadcast
  cancel-in-progress: false

jobs:
  check-price-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRICE_API_URL: https://price-tracker-sigma-lime.vercel.app/api/price
      TRACKER_URL: https://price-tracker-sigma-lime.vercel.app/
      PRODUCT_URL: https://24h.pchome.com.tw/prod/DAAT0R-1900GIZXQ
      PRODUCT_NAME: 滿意寶寶 純水99濕巾｜補充包 24包組
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - name: Check price and send LINE broadcast
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${LINE_CHANNEL_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret: LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi

          CHECK_TIME="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          CHECK_FAILED=0

          echo "Checking price from: ${PRICE_API_URL}"

          if RESPONSE="$(curl --fail --silent --show-error --retry 2 --max-time 30 "${PRICE_API_URL}")"; then
            SUCCESS="$(jq -r '.success // false' <<<"${RESPONSE}")"
            PRICE="$(jq -r '.price // empty' <<<"${RESPONSE}")"
            ORIGINAL_PRICE="$(jq -r '.original_price // empty' <<<"${RESPONSE}")"
            IN_STOCK="$(jq -r '.in_stock // false' <<<"${RESPONSE}")"

            if [ "${SUCCESS}" = "true" ] && [ -n "${PRICE}" ]; then
              if [ "${IN_STOCK}" = "true" ]; then
                STOCK_TEXT="✅ 有庫存"
              else
                STOCK_TEXT="❌ 無庫存"
              fi

              if [ -n "${ORIGINAL_PRICE}" ] && [ "${ORIGINAL_PRICE}" != "null" ]; then
                PRICE_TEXT="$(printf '目前價格：NT$%s\n原價：NT$%s' "${PRICE}" "${ORIGINAL_PRICE}")"
              else
                PRICE_TEXT="目前價格：NT$${PRICE}"
              fi

              MESSAGE="$(printf '🔎 商品價格自動檢查\n%s\n\n%s\n庫存：%s\n檢查時間：%s\n\n🛒 商品頁：%s\n📊 查價頁：%s' \
                "${PRODUCT_NAME}" "${PRICE_TEXT}" "${STOCK_TEXT}" "${CHECK_TIME}" "${PRODUCT_URL}" "${TRACKER_URL}")"
            else
              ERROR_TEXT="$(jq -r '.error // "API 回傳 success=false"' <<<"${RESPONSE}")"
              MESSAGE="$(printf '⚠️ 商品價格查詢失敗\n%s\n時間：%s\n原因：%s\n\n查價頁：%s' \
                "${PRODUCT_NAME}" "${CHECK_TIME}" "${ERROR_TEXT}" "${TRACKER_URL}")"
              CHECK_FAILED=1
            fi
          else
            MESSAGE="$(printf '⚠️ 商品價格查詢失敗\n%s\n時間：%s\n原因：無法連線到價格 API\n\n查價頁：%s' \
              "${PRODUCT_NAME}" "${CHECK_TIME}" "${TRACKER_URL}")"
            CHECK_FAILED=1
          fi

          PAYLOAD="$(jq -n --arg text "${MESSAGE}" '{messages: [{type: "text", text: $text}]}')"

          echo "Sending LINE broadcast..."
          curl --fail-with-body --silent --show-error \
            -X POST 'https://api.line.me/v2/bot/message/broadcast' \
            -H "Authorization: Bearer ${LINE_CHANNEL_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "${PAYLOAD}"

          echo
          echo "LINE broadcast sent."

          if [ "${CHECK_FAILED}" -ne 0 ]; then
            exit 1
          fi
