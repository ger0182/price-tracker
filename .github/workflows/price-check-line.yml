name: Price Check + LINE Broadcast

on:
  schedule:
    # Taiwan time: every day at 10:13 and 16:13
    - cron: '13 10,16 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check-line-broadcast
  cancel-in-progress: false

jobs:
  check-price-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRICE_API_URL: https://price-tracker-sigma-lime.vercel.app/api/price
      TRACKER_URL: https://price-tracker-sigma-lime.vercel.app/
      PRODUCT_URL: https://24h.pchome.com.tw/prod/DAAT0R-1900GIZXQ
      PRODUCT_NAME: 滿意寶寶 純水99濕巾｜補充包 24包組
      LOW_PRICE_THRESHOLD: '999'
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - name: Checkout shared price data branch
        uses: actions/checkout@v6
        with:
          ref: price-data
          fetch-depth: 1

      - name: Check price, save history and send LINE broadcast
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${LINE_CHANNEL_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret: LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi

          CHECK_TIME="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          CHECK_FAILED=0
          NORMAL_MESSAGE=""
          LOW_ALERT_MESSAGE=""

          echo "Checking price from: ${PRICE_API_URL}"

          if RESPONSE="$(curl --fail --silent --show-error --retry 2 --max-time 30 "${PRICE_API_URL}")"; then
            SUCCESS="$(jq -r '.success // false' <<<"${RESPONSE}")"
            PRICE="$(jq -r '.price // empty' <<<"${RESPONSE}")"
            ORIGINAL_PRICE="$(jq -r '.original_price // empty' <<<"${RESPONSE}")"
            IN_STOCK="$(jq -r '.in_stock // false' <<<"${RESPONSE}")"
            FETCHED_AT="$(jq -r '.fetched_at // empty' <<<"${RESPONSE}")"

            if [ "${SUCCESS}" = "true" ] && [ -n "${PRICE}" ]; then
              [ -n "${FETCHED_AT}" ] || FETCHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

              if [ ! -f price-history.json ]; then
                printf '{\n  "history": []\n}\n' > price-history.json
              fi

              PREVIOUS_PRICE="$(jq -r '.history[-1].price // empty' price-history.json 2>/dev/null || true)"

              if [ "${IN_STOCK}" = "true" ]; then
                STOCK_TEXT="✅ 有庫存"
              else
                STOCK_TEXT="❌ 無庫存"
              fi

              if [ -n "${ORIGINAL_PRICE}" ] && [ "${ORIGINAL_PRICE}" != "null" ]; then
                PRICE_TEXT="$(printf '目前價格：NT$%s\n原價：NT$%s' "${PRICE}" "${ORIGINAL_PRICE}")"
                ORIGINAL_JSON="${ORIGINAL_PRICE}"
              else
                PRICE_TEXT="目前價格：NT$${PRICE}"
                ORIGINAL_JSON="null"
              fi

              CHANGE_TEXT=""
              if [ -n "${PREVIOUS_PRICE}" ]; then
                CHANGE="$(jq -nr --arg now "${PRICE}" --arg prev "${PREVIOUS_PRICE}" '($now|tonumber) - ($prev|tonumber)')"
                if jq -e -n --arg c "${CHANGE}" '($c|tonumber) < 0' >/dev/null; then
                  ABS_CHANGE="$(jq -nr --arg c "${CHANGE}" '($c|tonumber) * -1')"
                  CHANGE_TEXT="$(printf '\n較上次：▼ NT$%s' "${ABS_CHANGE}")"
                elif jq -e -n --arg c "${CHANGE}" '($c|tonumber) > 0' >/dev/null; then
                  CHANGE_TEXT="$(printf '\n較上次：▲ NT$%s' "${CHANGE}")"
                else
                  CHANGE_TEXT="$(printf '\n較上次：價格不變')"
                fi
              fi

              NORMAL_MESSAGE="$(printf '🔎 商品價格自動檢查\n%s\n\n%s%s\n庫存：%s\n檢查時間：%s\n\n🛒 商品頁：%s\n📊 查價頁：%s' \
                "${PRODUCT_NAME}" "${PRICE_TEXT}" "${CHANGE_TEXT}" "${STOCK_TEXT}" "${CHECK_TIME}" "${PRODUCT_URL}" "${TRACKER_URL}")"

              IS_LOW="$(jq -nr --arg p "${PRICE}" --arg t "${LOW_PRICE_THRESHOLD}" '($p|tonumber) < ($t|tonumber)')"
              if [ "${IS_LOW}" = "true" ]; then
                LOW_ALERT_MESSAGE="$(printf '🔥🔥🔥 低價警報 🔥🔥🔥\n\n%s\n目前只要 NT$%s！\n已低於你設定的 NT$%s 門檻。\n\n%s\n\n👉 建議現在查看商品：\n%s' \
                  "${PRODUCT_NAME}" "${PRICE}" "${LOW_PRICE_THRESHOLD}" "${STOCK_TEXT}" "${PRODUCT_URL}")"
              fi

              TMP_FILE="$(mktemp)"
              jq \
                --arg date "${FETCHED_AT}" \
                --argjson price "${PRICE}" \
                --argjson original_price "${ORIGINAL_JSON}" \
                --argjson in_stock "${IN_STOCK}" \
                '.history = (((.history // []) + [{date: $date, price: $price, original_price: $original_price, in_stock: $in_stock}]) | .[-180:])' \
                price-history.json > "${TMP_FILE}"
              mv "${TMP_FILE}" price-history.json

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add price-history.json
              if ! git diff --cached --quiet; then
                git commit -m "Record price check ${CHECK_TIME}"
                git push origin price-data
              fi
            else
              ERROR_TEXT="$(jq -r '.error // "API 回傳 success=false"' <<<"${RESPONSE}")"
              NORMAL_MESSAGE="$(printf '⚠️ 商品價格查詢失敗\n%s\n時間：%s\n原因：%s\n\n查價頁：%s' \
                "${PRODUCT_NAME}" "${CHECK_TIME}" "${ERROR_TEXT}" "${TRACKER_URL}")"
              CHECK_FAILED=1
            fi
          else
            NORMAL_MESSAGE="$(printf '⚠️ 商品價格查詢失敗\n%s\n時間：%s\n原因：無法連線到價格 API\n\n查價頁：%s' \
              "${PRODUCT_NAME}" "${CHECK_TIME}" "${TRACKER_URL}")"
            CHECK_FAILED=1
          fi

          if [ -n "${LOW_ALERT_MESSAGE}" ]; then
            PAYLOAD="$(jq -n --arg normal "${NORMAL_MESSAGE}" --arg alert "${LOW_ALERT_MESSAGE}" \
              '{messages: [{type: "text", text: $normal}, {type: "text", text: $alert}]}')"
          else
            PAYLOAD="$(jq -n --arg normal "${NORMAL_MESSAGE}" \
              '{messages: [{type: "text", text: $normal}]}')"
          fi

          echo "Sending LINE broadcast..."
          curl --fail-with-body --silent --show-error \
            -X POST 'https://api.line.me/v2/bot/message/broadcast' \
            -H "Authorization: Bearer ${LINE_CHANNEL_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "${PAYLOAD}"

          echo
          echo "LINE broadcast sent."

          if [ "${CHECK_FAILED}" -ne 0 ]; then
            exit 1
          fi
